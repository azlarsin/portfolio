<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="陈成，拥有 10+ 年前端与全栈经验。职业前期覆盖客户端、PHP / Python 服务、数据库与部署；近年聚焦复杂前端系统、业务 SDK、跨端应用与团队管理。"
    />
    <meta name="theme-color" content="#f5f6f8" />
    <title>陈成｜前端技术负责人 · 全栈与复杂系统工程</title>
    <script>
      ;(() => {
        try {
          const savedLanguage = localStorage.getItem('portfolio-language')
          const browserLanguages = navigator.languages || [navigator.language]
          const language =
            savedLanguage === 'zh' || savedLanguage === 'en'
              ? savedLanguage
              : browserLanguages.some((value) => value.toLowerCase().startsWith('zh'))
                ? 'zh'
                : 'en'
          document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
          document.documentElement.dataset.language = language
          if (language === 'en') {
            document.title = 'Chen Cheng | Frontend Tech Lead · Full-Stack & Complex Systems'
            document.querySelector('meta[name="description"]').content =
              'Chen Cheng is a frontend and full-stack engineer with 10+ years of experience across complex systems, business SDKs, cross-platform applications, and team leadership.'
          }

          const preference = localStorage.getItem('portfolio-theme')
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme =
            preference === 'dark' || (preference !== 'light' && dark) ? 'dark' : 'light'
          document.documentElement.dataset.themePreference =
            preference === 'dark' || preference === 'light' ? preference : 'system'
          document.querySelector('meta[name="theme-color"]').content =
            document.documentElement.dataset.theme === 'dark' ? '#111318' : '#f5f6f8'
        } catch {
          document.documentElement.lang = 'zh-CN'
          document.documentElement.dataset.language = 'zh'
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.themePreference = 'system'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
